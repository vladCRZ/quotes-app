spring.application.name=rbac-demo

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/quotr?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.demo=DEBUG
logging.level.org.springframework.security=INFO

# Server
server.port=8080
